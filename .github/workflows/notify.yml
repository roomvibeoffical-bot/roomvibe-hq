name: Task notifications
on:
  schedule:
    - cron: "3-58/5 * * * *"
  workflow_dispatch:
concurrency:
  group: notify
  cancel-in-progress: false
jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Firebase Admin
        working-directory: notify
        run: npm install --no-save --no-audit --no-fund firebase-admin@12.7.0 nodemailer@6.9.16 google-auth-library@9.15.0
      - name: Service account email (share the sales sheet with this)
        continue-on-error: true
        run: node -e "const j=JSON.parse(process.env.SA||'{}'); console.log('SA_EMAIL=' + String(j.client_email||'').split('@').join(' AT '))"
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Import sales inbox (Google Sheet)
        working-directory: notify
        continue-on-error: true
        run: node inbox.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SALES_SHEET_ID: 1J3RtsxNhkgPxDJHFab2pRT2sv1JVk-mZ3dNNbesOIhg
      - name: Send notifications
        working-directory: notify
        run: node notify.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
